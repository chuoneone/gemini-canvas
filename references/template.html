<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【工具名稱】</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://unpkg.com/docx@7.3.0/build/index.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@200..900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Chiron GoRound TC', 'Noto Sans TC', sans-serif; }
        .print-only { display: none; }
        @media print {
            @page { size: A4; margin: 15mm; }
            body { font-family: "標楷體", "DFKai-SB", serif; background: white; color: black; line-height: 1.5; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .page-break { page-break-before: always; }
            .prevent-break { page-break-inside: avoid !important; break-inside: avoid !important; }
            #result-container { box-shadow: none !important; border: none !important; margin: 0 !important; padding: 0 !important; width: 100% !important; max-width: 100% !important; }
            * { overflow-wrap: break-word !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-4 no-print">【工具名稱】</h1>

        <!-- 輸入區 -->
        <div class="bg-white rounded-xl shadow p-4 mb-4 no-print space-y-3">
            <textarea id="text-input" rows="8" class="w-full border rounded p-2" placeholder="貼上文本…"></textarea>
            <textarea id="student-profile" rows="2" class="w-full border rounded p-2" placeholder="學生狀況描述（選填）"></textarea>
            <select id="format-select" class="border rounded p-2">
                <option value="mixed">混合題型</option>
                <option value="multiple-choice">選擇題</option>
                <option value="fill-in-the-blank">填空題</option>
                <option value="open-ended">開放式問答</option>
            </select>
            <button id="generate-btn" class="bg-indigo-600 text-white px-4 py-2 rounded disabled:opacity-50">生成</button>
            <p id="error-message" class="hidden text-red-600"></p>
        </div>

        <!-- 結果區 -->
        <div id="result-container" class="bg-white rounded-xl shadow p-6 hidden"></div>
        <div id="action-buttons" class="mt-4 space-x-2 hidden no-print">
            <button id="print-btn" class="bg-slate-700 text-white px-4 py-2 rounded">列印</button>
            <button id="docx-btn" class="bg-blue-600 text-white px-4 py-2 rounded">匯出 Word</button>
        </div>
    </div>

    <script>
        // ===== Canvas 環境：apiKey 必須保持空字串，執行時由 Canvas 帶入 =====
        const apiKey = "";
        const TEXT_MODEL = "gemini-2.5-flash-preview-09-2025";
        const IMAGE_MODEL = "gemini-3.1-flash-image-preview";

        const $ = (id) => document.getElementById(id);
        let generatedContent = null;

        async function fetchWithBackoff(url, options, maxRetries = 5) {
            let delay = 1000;
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(`API Error: ${response.status} ${response.statusText} - ${errorData.error?.message || ''}`);
                    }
                    return response.json();
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2;
                }
            }
        }

        // 文字出題：systemInstruction + responseMimeType + responseSchema
        async function generateQuestions(text, profile, formatChoice) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${TEXT_MODEL}:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text }] }],
                systemInstruction: { parts: [{ text:
                    `你是一位經驗豐富的特教老師。\n學生狀況：${profile || "一般程度學生"}\n題型：${formatChoice}\n請依文本設計學習單。` }] },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            title: { type: "STRING", description: "學習單標題" },
                            questions: {
                                type: "ARRAY",
                                items: {
                                    type: "OBJECT",
                                    properties: {
                                        question: { type: "STRING" },
                                        scaffold: { type: "STRING", description: "學生鷹架（選項或提示），無則留空" },
                                        teacherAnswer: { type: "STRING", description: "教師參考解答" }
                                    },
                                    required: ["question", "scaffold", "teacherAnswer"]
                                }
                            }
                        },
                        required: ["title", "questions"]
                    }
                }
            };
            const result = await fetchWithBackoff(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            return JSON.parse(result.candidates[0].content.parts[0].text);
        }

        // 圖片生成（題目需要插圖時才呼叫）
        async function generateImage(prompt, aspectRatio = "4:3") {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${IMAGE_MODEL}:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { responseModalities: ['IMAGE'], imageConfig: { aspectRatio } }
            };
            const data = await fetchWithBackoff(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const part = data?.candidates?.[0]?.content?.parts?.find(p => p.inlineData?.data);
            if (!part) throw new Error('圖片生成失敗');
            return `data:${part.inlineData.mimeType || 'image/png'};base64,${part.inlineData.data}`;
        }

        function showError(msg) { $('error-message').textContent = msg; $('error-message').classList.remove('hidden'); }

        function render(content) {
            const c = $('result-container');
            c.classList.remove('hidden');
            c.innerHTML = `<h2 class="text-xl font-bold mb-4">${content.title}</h2>` +
                content.questions.map((q, i) =>
                    `<div class="prevent-break mb-4"><p class="font-semibold">${i + 1}. ${q.question}</p>` +
                    (q.scaffold ? `<p class="whitespace-pre-line ml-4">${q.scaffold}</p>` : '') +
                    `<p class="text-sm text-slate-500 no-print">解答：${q.teacherAnswer}</p></div>`).join('');
            $('action-buttons').classList.remove('hidden');
        }

        $('generate-btn').addEventListener('click', async () => {
            const text = $('text-input').value.trim();
            if (!text) return showError('請輸入或貼上文本。');
            $('error-message').classList.add('hidden');
            $('generate-btn').disabled = true;
            $('generate-btn').textContent = 'AI 正在處理中...';
            try {
                generatedContent = await generateQuestions(text, $('student-profile').value.trim(), $('format-select').value);
                render(generatedContent);
            } catch (e) {
                showError('生成失敗：' + e.message);
            } finally {
                $('generate-btn').disabled = false;
                $('generate-btn').textContent = '生成';
            }
        });

        $('print-btn').addEventListener('click', () => window.print());

        // 匯出原生 Word（docx 7.x 全域 docx）
        $('docx-btn').addEventListener('click', async () => {
            if (!generatedContent) return;
            const { Document, Packer, Paragraph, TextRun, HeadingLevel } = docx;
            const children = [new Paragraph({ text: generatedContent.title, heading: HeadingLevel.HEADING_1 })];
            generatedContent.questions.forEach((q, i) => {
                children.push(new Paragraph({ children: [new TextRun({ text: `${i + 1}. ${q.question}`, bold: true })] }));
                if (q.scaffold) q.scaffold.split('\n').forEach(line => children.push(new Paragraph({ text: line })));
            });
            const doc = new Document({ sections: [{ children }] });
            const blob = await Packer.toBlob(doc);
            saveAs(blob, `${generatedContent.title || "學習單"}.docx`);
        });
    </script>
</body>
</html>
